# Docs for this repo are built as part of the unified pymmcore-plus site:
# https://github.com/pymmcore-plus/pymmcore-plus.github.io
#
# - Pull requests build the whole site with this PR's changes (failing only on
#   warnings in this repo's pages); download the "site" artifact to browse it.
# - Pushes to main trigger a rebuild + deploy of the site.
name: docs

on:
  pull_request:
    paths: &paths
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "README.md"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'pull_request'
    uses: pymmcore-plus/pymmcore-plus.github.io/.github/workflows/build.yml@main
    with:
      member: napari-micromanager
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.sha }}

  deploy:
    if: github.event_name != 'pull_request' && github.repository_owner == 'pymmcore-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: pymmcore-plus
          repositories: pymmcore-plus.github.io
      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          gh workflow run deploy.yml -R pymmcore-plus/pymmcore-plus.github.io
          -f source="${{ github.repository }}@${{ github.sha }}"
